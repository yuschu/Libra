<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>交通流量演示 - Libra</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b1e3a; color: #fff; min-height: 100vh; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: rgba(255,255,255,0.03); border-bottom: 1px solid rgba(255,255,255,0.08); }
    .header h1 { margin: 0; font-size: 20px; font-weight: 600; }
    .header-actions { display: flex; gap: 12px; }
    .btn { padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; }
    .btn-primary { background: #1890ff; color: #fff; }
    .btn-primary:hover { background: #40a9ff; }
    .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
    .btn-secondary:hover { background: rgba(255,255,255,0.2); }
    .chart-container { padding: 24px; }
    #chart { width: 100%; height: 70vh; }
    
    /* Empty state modal */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px); }
    .modal { background: #1a2d4a; border-radius: 16px; padding: 40px; max-width: 480px; width: 90%; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); }
    .modal-icon { font-size: 64px; margin-bottom: 16px; }
    .modal h2 { margin: 0 0 12px; font-size: 24px; font-weight: 600; }
    .modal p { margin: 0 0 24px; color: rgba(255,255,255,0.7); font-size: 15px; line-height: 1.6; }
    .modal-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .modal-btn { padding: 12px 28px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; transition: all 0.2s; }
    .modal-btn-primary { background: #1890ff; color: #fff; }
    .modal-btn-primary:hover { background: #40a9ff; }
    .modal-btn-secondary { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
    .modal-btn-secondary:hover { background: rgba(255,255,255,0.2); }
  </style>
</head>
<body>
  <header class="header">
    <h1>🚦 交通流量演示大屏</h1>
    <div class="header-actions">
      <a class="btn btn-secondary" href="upload.html">📤 数据上传</a>
    </div>
  </header>
  
  <div class="chart-container">
    <div id="chart"></div>
  </div>
  
  <!-- Empty state modal -->
  <div class="modal-overlay" id="emptyModal">
    <div class="modal">
      <div class="modal-icon">📊</div>
      <h2>暂无数据</h2>
      <p>数据库中还没有交通流量数据。请选择一种方式开始：</p>
      <div class="modal-buttons">
        <button class="modal-btn modal-btn-primary" id="btnUseSample">使用示例数据</button>
        <button class="modal-btn modal-btn-secondary" id="btnGoUpload">导入我的数据</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "/api/v1";
    const chart = echarts.init(document.getElementById("chart"));
    const emptyModal = document.getElementById("emptyModal");
    const btnUseSample = document.getElementById("btnUseSample");
    const btnGoUpload = document.getElementById("btnGoUpload");
    
    let chartLoaded = false;
    
    // Check data status on load
    async function checkDataStatus() {
      try {
        const response = await fetch(`${API_BASE}/data/status`);
        const result = await response.json();
        
        if (result.code === 0 && !result.data.has_data) {
          // Show empty state modal
          emptyModal.style.display = "flex";
        } else {
          loadChart();
        }
      } catch (err) {
        console.error("Failed to check data status:", err);
        loadChart(); // fallback
      }
    }
    
    // Load sample data
    btnUseSample.addEventListener("click", async () => {
      btnUseSample.disabled = true;
      btnUseSample.textContent = "加载中...";
      try {
        const response = await fetch(`${API_BASE}/data/sample`, { method: "POST" });
        const result = await response.json();
        if (result.code === 0) {
          emptyModal.style.display = "none";
          loadChart();
        } else {
          alert("加载失败: " + (result.message || "未知错误"));
        }
      } catch (err) {
        alert("加载失败: " + err.message);
      } finally {
        btnUseSample.disabled = false;
        btnUseSample.textContent = "使用示例数据";
      }
    });
    
    // Go to upload page
    btnGoUpload.addEventListener("click", () => {
      window.location.href = "upload.html";
    });
    
    // Load chart data
    function loadChart() {
      if (chartLoaded) return;
      chartLoaded = true;
      
      fetch(`${API_BASE}/traffic/flows`)
        .then(r => r.json())
        .then(res => {
          if (res.code !== 0) throw new Error(res.message);
          const d = res.data;
          chart.setOption({
            backgroundColor: "transparent",
            tooltip: { trigger: "axis" },
            xAxis: { type: "category", data: d.labels, axisLine: { lineStyle: { color: "rgba(255,255,255,0.3)" } }, axisLabel: { color: "rgba(255,255,255,0.8)" } },
            yAxis: { type: "value", name: "流量(辆)", axisLine: { lineStyle: { color: "rgba(255,255,255,0.3)" } }, axisLabel: { color: "rgba(255,255,255,0.8)" }, splitLine: { lineStyle: { color: "rgba(255,255,255,0.1)" } } },
            grid: { left: 60, right: 40, top: 20, bottom: 40 },
            series: [{
              type: "line",
              smooth: true,
              data: d.values,
              lineStyle: { color: "#1890ff", width: 3 },
              areaStyle: { opacity: 0.2, color: { type: "linear", x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: "#1890ff" }, { offset: 1, color: "rgba(24,144,255,0)" }] } },
              symbol: "circle",
              symbolSize: 6,
              itemStyle: { color: "#1890ff" }
            }]
          });
        })
        .catch(e => console.error("Chart load error:", e));
      
      window.addEventListener("resize", () => chart.resize());
    }
    
    // Initialize
    checkDataStatus();
  </script>
</body>
</html>
