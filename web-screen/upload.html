<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数据上传 - Libra</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f7fa; color: #333; min-height: 100vh; }
    .container { max-width: 900px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 28px; font-weight: 600; margin-bottom: 8px; color: #1a1a2e; }
    .subtitle { color: #666; margin-bottom: 24px; }
    
    .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 24px; margin-bottom: 24px; }
    .card h2 { font-size: 18px; font-weight: 600; margin-bottom: 16px; color: #1a1a2e; }
    
    /* Drop zone */
    .drop-zone { border: 2px dashed #d0d5dd; border-radius: 8px; padding: 40px 24px; text-align: center; cursor: pointer; transition: all 0.2s; background: #fafbfc; }
    .drop-zone:hover, .drop-zone.drag-over { border-color: #1890ff; background: #e6f4ff; }
    .drop-zone-icon { font-size: 48px; color: #1890ff; margin-bottom: 12px; }
    .drop-zone-text { font-size: 16px; color: #333; margin-bottom: 4px; }
    .drop-zone-hint { font-size: 13px; color: #999; }
    .file-input { display: none; }
    
    /* Progress */
    .progress-container { display: none; margin-top: 16px; }
    .progress-bar { height: 6px; background: #f0f0f0; border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: #1890ff; border-radius: 3px; transition: width 0.3s; width: 0%; }
    .progress-text { font-size: 13px; color: #666; margin-top: 8px; text-align: right; }
    
    /* Results table */
    .results-table { width: 100%; border-collapse: collapse; margin-top: 16px; display: none; }
    .results-table th, .results-table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #f0f0f0; }
    .results-table th { font-weight: 600; color: #666; font-size: 13px; background: #fafbfc; }
    .results-table td { font-size: 14px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; }
    .badge-success { background: #f6ffed; color: #52c41a; }
    .badge-warning { background: #fffbe6; color: #faad14; }
    .badge-error { background: #fff1f0; color: #ff4d4f; }
    .badge-info { background: #e6f4ff; color: #1890ff; }
    .bad-rows-btn { background: none; border: none; color: #1890ff; font-size: 13px; cursor: pointer; padding: 0; }
    .bad-rows-btn:hover { text-decoration: underline; }
    
    /* Buttons */
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 20px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; border: none; text-decoration: none; }
    .btn-primary { background: #1890ff; color: #fff; }
    .btn-primary:hover { background: #40a9ff; }
    .btn-secondary { background: #fff; color: #333; border: 1px solid #d9d9d9; }
    .btn-secondary:hover { background: #f5f5f5; border-color: #1890ff; color: #1890ff; }
    .btn-danger { background: #fff1f0; color: #ff4d4f; border: 1px solid #ffccc7; }
    .btn-danger:hover { background: #ffccc7; }
    .btn-group { display: flex; gap: 12px; flex-wrap: wrap; }
    
    /* Toast */
    .toast { position: fixed; bottom: 24px; right: 24px; padding: 16px 24px; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); z-index: 1000; animation: slideIn 0.3s ease; display: none; }
    .toast.success { background: #52c41a; color: #fff; }
    .toast.error { background: #ff4d4f; color: #fff; }
    .toast.info { background: #1890ff; color: #fff; }
    @keyframes slideIn { from { opacity: 0; transform: translateX(100px); } to { opacity: 1; transform: translateX(0); } }
    
    /* Modal for bad rows */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal { background: #fff; border-radius: 12px; padding: 24px; max-width: 600px; width: 90%; max-height: 80vh; overflow: auto; }
    .modal h3 { margin-bottom: 16px; }
    .modal-close { position: absolute; top: 16px; right: 16px; background: none; border: none; font-size: 20px; cursor: pointer; color: #999; }
    .bad-row-item { padding: 12px; background: #fafbfc; border-radius: 6px; margin-bottom: 8px; font-size: 13px; }
    .bad-row-index { font-weight: 600; color: #333; }
    .bad-row-errors { color: #ff4d4f; margin-top: 4px; }
    .bad-row-data { color: #999; font-family: monospace; font-size: 12px; margin-top: 4px; word-break: break-all; }
  </style>
</head>
<body>
  <div class="container">
    <h1>数据上传</h1>
    <p class="subtitle">支持 CSV / Excel 文件批量导入，自动识别列、清洗脏行、按小时聚合入库</p>
    
    <!-- Upload Card -->
    <div class="card">
      <h2>上传文件</h2>
      <div class="drop-zone" id="dropZone">
        <div class="drop-zone-icon">📁</div>
        <div class="drop-zone-text">点击或拖拽文件到此处</div>
        <div class="drop-zone-hint">支持 .csv, .xlsx, .xls 格式，单文件 ≤ 10MB，最多 50 个文件</div>
        <input type="file" class="file-input" id="fileInput" multiple accept=".csv,.xlsx,.xls" />
      </div>
      
      <div class="progress-container" id="progressContainer">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText">准备上传...</div>
      </div>
      
      <table class="results-table" id="resultsTable">
        <thead>
          <tr>
            <th>文件名</th>
            <th>导入行数</th>
            <th>新增</th>
            <th>更新</th>
            <th>跳过</th>
            <th>坏行</th>
            <th>状态</th>
          </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
      </table>
    </div>
    
    <!-- Action Buttons -->
    <div class="card">
      <h2>快速操作</h2>
      <div class="btn-group">
        <button class="btn btn-primary" id="btnSample">使用示例数据</button>
        <button class="btn btn-danger" id="btnClear">清空所有数据</button>
        <a class="btn btn-secondary" href="index.html">返回大屏</a>
      </div>
    </div>
  </div>
  
  <!-- Toast -->
  <div class="toast" id="toast"></div>
  
  <!-- Bad rows modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <button class="modal-close" id="modalClose">&times;</button>
      <h3>坏行详情</h3>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    const API_BASE = "/api/v1";
    const dropZone = document.getElementById("dropZone");
    const fileInput = document.getElementById("fileInput");
    const progressContainer = document.getElementById("progressContainer");
    const progressFill = document.getElementById("progressFill");
    const progressText = document.getElementById("progressText");
    const resultsTable = document.getElementById("resultsTable");
    const resultsBody = document.getElementById("resultsBody");
    const btnSample = document.getElementById("btnSample");
    const btnClear = document.getElementById("btnClear");
    const toast = document.getElementById("toast");
    const modalOverlay = document.getElementById("modalOverlay");
    const modalClose = document.getElementById("modalClose");
    const modalContent = document.getElementById("modalContent");
    
    let uploadedFiles = [];
    
    // Drop zone events
    dropZone.addEventListener("click", () => fileInput.click());
    dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("drag-over"); });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("drag-over"));
    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.classList.remove("drag-over");
      handleFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener("change", (e) => handleFiles(e.target.files));
    
    function handleFiles(files) {
      if (files.length === 0) return;
      if (files.length > 50) {
        showToast("单次上传文件数不能超过 50 个", "error");
        return;
      }
      
      uploadedFiles = Array.from(files);
      fileInput.value = ""; // reset
      uploadFiles();
    }
    
    async function uploadFiles() {
      const formData = new FormData();
      uploadedFiles.forEach(f => formData.append("files", f));
      
      progressContainer.style.display = "block";
      resultsTable.style.display = "none";
      progressFill.style.width = "0%";
      progressText.textContent = "上传中...";
      
      try {
        const response = await fetch(`${API_BASE}/data/upload`, {
          method: "POST",
          body: formData
        });
        
        const result = await response.json();
        
        if (result.code === 0) {
          showResults(result.data);
          showToast("上传完成", "success");
        } else {
          showToast(result.message || "上传失败", "error");
        }
      } catch (err) {
        showToast("上传失败: " + err.message, "error");
      } finally {
        progressContainer.style.display = "none";
      }
    }
    
    function showResults(data) {
      resultsBody.innerHTML = "";
      data.forEach((item, idx) => {
        const row = document.createElement("tr");
        const hasError = item.error;
        const badCount = item.bad_rows?.length || 0;
        
        let statusBadge = "";
        if (hasError) {
          statusBadge = '<span class="badge badge-error">失败</span>';
        } else if (badCount > 0) {
          statusBadge = '<span class="badge badge-warning">部分失败</span>';
        } else {
          statusBadge = '<span class="badge badge-success">成功</span>';
        }
        
        row.innerHTML = `
          <td>${escapeHtml(item.filename)}</td>
          <td>${(item.inserted + item.updated + item.skipped).toLocaleString()}</td>
          <td>${item.inserted.toLocaleString()}</td>
          <td>${item.updated.toLocaleString()}</td>
          <td>${item.skipped.toLocaleString()}</td>
          <td>
            ${badCount > 0 
              ? `<button class="bad-rows-btn" onclick="showBadRows(${idx})">${badCount} 条</button>`
              : "-"}
          </td>
          <td>${statusBadge}</td>
        `;
        resultsBody.appendChild(row);
      });
      resultsTable.style.display = "table";
    }
    
    function showBadRows(index) {
      const item = dataCache[index];
      if (!item || !item.bad_rows || item.bad_rows.length === 0) return;
      
      modalContent.innerHTML = item.bad_rows.map(br => `
        <div class="bad-row-item">
          <div class="bad-row-index">第 ${br.row_index + 1} 行</div>
          <div class="bad-row-errors">错误: ${br.errors.join("; ")}</div>
          <div class="bad-row-data">原始数据: ${JSON.stringify(br.raw_data)}</div>
        </div>
      `).join("");
      modalOverlay.style.display = "flex";
    }
    
    let dataCache = [];
    
    // Update showResults to cache data
    function showResults(data) {
      dataCache = data;
      resultsBody.innerHTML = "";
      data.forEach((item, idx) => {
        const row = document.createElement("tr");
        const hasError = item.error;
        const badCount = item.bad_rows?.length || 0;
        
        let statusBadge = "";
        if (hasError) {
          statusBadge = '<span class="badge badge-error">失败</span>';
        } else if (badCount > 0) {
          statusBadge = '<span class="badge badge-warning">部分失败</span>';
        } else {
          statusBadge = '<span class="badge badge-success">成功</span>';
        }
        
        row.innerHTML = `
          <td>${escapeHtml(item.filename)}</td>
          <td>${(item.inserted + item.updated + item.skipped).toLocaleString()}</td>
          <td>${item.inserted.toLocaleString()}</td>
          <td>${item.updated.toLocaleString()}</td>
          <td>${item.skipped.toLocaleString()}</td>
          <td>
            ${badCount > 0 
              ? `<button class="bad-rows-btn" onclick="showBadRows(${idx})">${badCount} 条</button>`
              : "-"}
          </td>
          <td>${statusBadge}</td>
        `;
        resultsBody.appendChild(row);
      });
      resultsTable.style.display = "table";
    }
    
    // Sample data
    btnSample.addEventListener("click", async () => {
      btnSample.disabled = true;
      btnSample.textContent = "加载中...";
      try {
        const r = await fetch(`${API_BASE}/data/sample`, { method: "POST" });
        const result = await r.json();
        if (result.code === 0) {
          showToast("示例数据加载完成", "success");
        } else {
          showToast(result.message || "加载失败", "error");
        }
      } catch (err) {
        showToast("加载失败: " + err.message, "error");
      } finally {
        btnSample.disabled = false;
        btnSample.textContent = "使用示例数据";
      }
    });
    
    // Clear data
    btnClear.addEventListener("click", async () => {
      if (!confirm("确定要清空所有交通流量数据吗？此操作不可恢复。")) return;
      btnClear.disabled = true;
      btnClear.textContent = "清空中...";
      try {
        const r = await fetch(`${API_BASE}/data/clear`, { method: "POST" });
        const result = await r.json();
        if (result.code === 0) {
          showToast(`已清空 ${result.data.cleared_rows} 条数据`, "success");
          resultsBody.innerHTML = "";
          resultsTable.style.display = "none";
        } else {
          showToast(result.message || "清空失败", "error");
        }
      } catch (err) {
        showToast("清空失败: " + err.message, "error");
      } finally {
        btnClear.disabled = false;
        btnClear.textContent = "清空所有数据";
      }
    });
    
    // Toast
    function showToast(message, type = "info") {
      toast.textContent = message;
      toast.className = "toast " + type;
      toast.style.display = "block";
      setTimeout(() => { toast.style.display = "none"; }, 3000);
    }
    
    // Modal
    modalClose.addEventListener("click", () => modalOverlay.style.display = "none");
    modalOverlay.addEventListener("click", (e) => {
      if (e.target === modalOverlay) modalOverlay.style.display = "none";
    });
    
    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
